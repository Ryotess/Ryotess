<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Ryotess retro terminal banner</title>
  <desc id="desc">A dark CRT terminal interface introducing Ryotess as an AI and machine learning engineer and data scientist in Taipei.</desc>

  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07100d" />
      <stop offset="0.55" stop-color="#0a1511" />
      <stop offset="1" stop-color="#040806" />
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="46%" r="70%">
      <stop offset="0" stop-color="#00f5a0" stop-opacity="0.10" />
      <stop offset="0.65" stop-color="#00f5a0" stop-opacity="0.025" />
      <stop offset="1" stop-color="#00f5a0" stop-opacity="0" />
    </radialGradient>

    <pattern id="scanlines" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="4" fill="#000" opacity="0.12" />
    </pattern>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00f5a0" stroke-width="1" opacity="0.045" />
    </pattern>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="hardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <clipPath id="screenClip">
      <rect x="18" y="18" width="1164" height="324" rx="18" />
    </clipPath>

    <style>
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .blink { animation: blink 1.05s steps(2, jump-none) infinite; }
      .pulse { animation: pulse 2.2s ease-in-out infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes pulse { 50% { opacity: 0.46; } }
      @media (prefers-reduced-motion: reduce) {
        .blink, .pulse { animation: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="360" rx="26" fill="#020403" />
  <rect x="7" y="7" width="1186" height="346" rx="22" fill="#111815" stroke="#27362f" stroke-width="2" />
  <rect x="18" y="18" width="1164" height="324" rx="18" fill="url(#screen)" stroke="#00f5a0" stroke-opacity="0.32" stroke-width="2" />

  <g clip-path="url(#screenClip)">
    <rect x="18" y="18" width="1164" height="324" fill="url(#glow)" />
    <rect x="18" y="18" width="1164" height="324" fill="url(#grid)" />

    <path d="M18 74H1182" stroke="#00f5a0" stroke-opacity="0.22" />
    <circle cx="48" cy="47" r="6" fill="#ff5f57" />
    <circle cx="70" cy="47" r="6" fill="#ffbd2e" />
    <circle cx="92" cy="47" r="6" fill="#28c840" />
    <text x="600" y="53" text-anchor="middle" class="mono" font-size="13" letter-spacing="3" fill="#688f7d">RYOTESS_OS // CRT-01</text>

    <g transform="translate(58 102)">
      <text class="mono" font-size="17" letter-spacing="2" fill="#ffb000">&gt; PRODUCTION SYSTEMS ONLINE</text>
      <circle cx="359" cy="-6" r="5" fill="#00f5a0" class="pulse" filter="url(#hardGlow)" />

      <text y="79" class="mono" font-size="62" font-weight="700" letter-spacing="7" fill="#00f5a0" opacity="0.52" filter="url(#softGlow)">RYOTESS</text>
      <text y="79" class="mono" font-size="62" font-weight="700" letter-spacing="7" fill="#00f5a0">RYOTESS</text>
      <text y="116" class="mono" font-size="18" letter-spacing="2.7" fill="#c6ffdf">MACHINE LEARNING ENGINEER // APPLIED AI</text>

      <path d="M0 142H670" stroke="#00f5a0" stroke-opacity="0.34" />
      <text y="174" class="mono" font-size="13" letter-spacing="1.8" fill="#82aa96">TAIPEI // PRODUCTION LLM AGENTS // SEARCH // RECOMMENDERS</text>
      <text x="0" y="205" class="mono" font-size="17" fill="#ffb000">$ deploy --production-ai</text>
      <rect x="253" y="188" width="12" height="21" fill="#ffb000" class="blink" filter="url(#hardGlow)" />
    </g>

    <g transform="translate(942 122)" opacity="0.9">
      <circle cx="92" cy="70" r="66" fill="none" stroke="#00f5a0" stroke-opacity="0.18" />
      <circle cx="92" cy="70" r="49" fill="none" stroke="#00f5a0" stroke-opacity="0.28" stroke-dasharray="3 8" />
      <circle cx="92" cy="70" r="30" fill="none" stroke="#ffb000" stroke-opacity="0.48" />
      <path d="M92 0V140M22 70H162" stroke="#00f5a0" stroke-opacity="0.17" />
      <path d="M92 70L132 37" stroke="#ffb000" stroke-width="2" filter="url(#hardGlow)" />
      <circle cx="92" cy="70" r="5" fill="#ffb000" />
      <text x="92" y="164" text-anchor="middle" class="mono" font-size="12" letter-spacing="3" fill="#688f7d">SIGNAL LOCKED</text>
    </g>

    <rect x="18" y="18" width="1164" height="324" fill="url(#scanlines)" pointer-events="none" />
    <path d="M34 26H1166M34 334H1166" stroke="#fff" stroke-opacity="0.025" stroke-width="2" />
  </g>
</svg>
